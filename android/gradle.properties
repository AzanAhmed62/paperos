# A 4 GB heap made the daemon the largest process on a small build host and
# allowed the OS to terminate it during Gradle's Kotlin-DSL configuration.
# 1.5 GB is enough for this single-module app and leaves room for Flutter.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# The build host can be slow or remote; give artifact downloads a generous
# window instead of failing on Gradle's default socket timeout.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
